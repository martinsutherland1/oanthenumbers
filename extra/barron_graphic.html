<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barron Impact — @oanthenumbers</title>
  <style>
    :root {
      --primary: #f1c40f;
      --background: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --rangers: #1D4ED8;
      --without: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 32px 16px;
    }

    .graphic {
      width: 860px;
      margin: 0 auto;
    }

    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-text { flex: 1; }

    .header-text h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1.2;
    }

    .header-text .subtitle {
      font-size: 0.8rem;
      color: var(--primary);
      margin-top: 3px;
    }

    .header-badge {
      background: var(--rangers);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      justify-content: flex-end;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.73rem;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .section-tag {
      background: var(--primary);
      color: #000;
      font-size: 0.63rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .section-counts {
      margin-left: auto;
      display: flex;
      gap: 14px;
    }

    .count-badge {
      font-size: 0.7rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .count-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .comp-grid {
      display: grid;
      grid-template-columns: 160px 1fr 1fr 1fr;
    }

    .comp-cell {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .comp-cell:nth-child(4n) {
      border-right: none;
    }

    .comp-cell:nth-last-child(-n+4) {
      border-bottom: none;
    }

    .comp-col-head {
      text-align: center;
      padding: 12px 18px;
    }

    .col-accent {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-bottom: 5px;
    }

    .col-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
    }

    .col-count {
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .comp-metric-label {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-name {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
    }

    .metric-sub {
      font-size: 0.62rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .comp-value {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .comp-val {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .comp-delta {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .good  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .bad   { background: rgba(239,68,68,0.15);  color: var(--red); }
    .muted { color: var(--text-secondary); }

    .stats-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
    }

    .stats-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .stats-card-title {
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .stats-card-mins {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .stats-card-mins strong {
      color: var(--primary);
      font-weight: 700;
    }

    .stat-row {
      display: flex;
      gap: 0;
    }

    .stat-box {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
    }

    .stat-box + .stat-box {
      border-left: 1px solid var(--border);
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .stat-value.headline {
      font-size: 2rem;
    }

    .stat-label {
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 5px;
    }

    .stat-row-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .per90-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 0.71rem;
      color: var(--text-secondary);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="graphic">

    <div class="header">
      <img class="logo" src="../public/logo.PNG" alt="@oanthenumbers">
      <div class="header-text">
        <h1>Connor Barron</h1>
        <div class="subtitle">SPFL Premiership 2025/26 &middot; Rangers FC &middot; Goals &amp; Possession per game</div>
      </div>
    </div>

    <div id="stats-card"></div>
    <div id="sections"></div>

    <div class="footer">
      Data via Fotmob &middot; Graphic by <a href="#">@oanthenumbers</a>
    </div>

  </div>

  <script>
    const data = [
      {"date":"2025-08-02","opposition":"motherwell","home_away":"Away","goals_for":1,"goals_against":1,"npxg_for":0.83,"npxg_against":2.13,"barron_minutes":17,"rangers_possession":62},
      {"date":"2025-08-09","opposition":"dundee-fc","home_away":"Home","goals_for":1,"goals_against":1,"npxg_for":1.18,"npxg_against":0.34,"barron_minutes":0,"rangers_possession":76},
      {"date":"2025-08-23","opposition":"st-mirren","home_away":"Away","goals_for":1,"goals_against":1,"npxg_for":1.56,"npxg_against":1.01,"barron_minutes":0,"rangers_possession":71},
      {"date":"2025-08-30","opposition":"celtic","home_away":"Home","goals_for":0,"goals_against":0,"npxg_for":0.15,"npxg_against":0.19,"barron_minutes":0,"rangers_possession":41},
      {"date":"2025-09-13","opposition":"hearts","home_away":"Home","goals_for":0,"goals_against":2,"npxg_for":1.1,"npxg_against":0.98,"barron_minutes":56,"rangers_possession":66},
      {"date":"2025-09-28","opposition":"livingston","home_away":"Away","goals_for":2,"goals_against":1,"npxg_for":1.59,"npxg_against":0.74,"barron_minutes":82,"rangers_possession":65},
      {"date":"2025-10-05","opposition":"falkirk","home_away":"Away","goals_for":1,"goals_against":1,"npxg_for":1.09,"npxg_against":1.32,"barron_minutes":83,"rangers_possession":57},
      {"date":"2025-10-18","opposition":"dundee-united","home_away":"Home","goals_for":2,"goals_against":2,"npxg_for":1.62,"npxg_against":0.62,"barron_minutes":7,"rangers_possession":68},
      {"date":"2025-10-26","opposition":"kilmarnock","home_away":"Home","goals_for":3,"goals_against":1,"npxg_for":1.36,"npxg_against":1.04,"barron_minutes":28,"rangers_possession":75},
      {"date":"2025-10-29","opposition":"hibernian","home_away":"Away","goals_for":1,"goals_against":0,"npxg_for":0.52,"npxg_against":1.22,"barron_minutes":90,"rangers_possession":51},
      {"date":"2025-11-09","opposition":"dundee-fc","home_away":"Away","goals_for":3,"goals_against":0,"npxg_for":0.85,"npxg_against":0.43,"barron_minutes":45,"rangers_possession":54},
      {"date":"2025-11-22","opposition":"livingston","home_away":"Home","goals_for":2,"goals_against":1,"npxg_for":1.39,"npxg_against":1.37,"barron_minutes":1,"rangers_possession":73},
      {"date":"2025-11-30","opposition":"falkirk","home_away":"Home","goals_for":0,"goals_against":0,"npxg_for":2.13,"npxg_against":0.12,"barron_minutes":76,"rangers_possession":61},
      {"date":"2025-12-03","opposition":"dundee-united","home_away":"Away","goals_for":2,"goals_against":2,"npxg_for":3.6,"npxg_against":1.38,"barron_minutes":90,"rangers_possession":67},
      {"date":"2025-12-06","opposition":"kilmarnock","home_away":"Away","goals_for":3,"goals_against":0,"npxg_for":0.75,"npxg_against":0.66,"barron_minutes":90,"rangers_possession":60},
      {"date":"2025-12-15","opposition":"hibernian","home_away":"Home","goals_for":1,"goals_against":0,"npxg_for":1.84,"npxg_against":0.53,"barron_minutes":77,"rangers_possession":52},
      {"date":"2025-12-21","opposition":"hearts","home_away":"Away","goals_for":1,"goals_against":2,"npxg_for":2.33,"npxg_against":1.7,"barron_minutes":74,"rangers_possession":58},
      {"date":"2025-12-27","opposition":"motherwell","home_away":"Home","goals_for":1,"goals_against":0,"npxg_for":4.04,"npxg_against":1.06,"barron_minutes":90,"rangers_possession":46},
      {"date":"2025-12-30","opposition":"st-mirren","home_away":"Home","goals_for":2,"goals_against":1,"npxg_for":1.89,"npxg_against":0.89,"barron_minutes":21,"rangers_possession":58},
      {"date":"2026-01-03","opposition":"celtic","home_away":"Away","goals_for":3,"goals_against":1,"npxg_for":1.06,"npxg_against":2.33,"barron_minutes":90,"rangers_possession":34},
      {"date":"2026-01-06","opposition":"aberdeen","home_away":"Home","goals_for":2,"goals_against":0,"npxg_for":1.81,"npxg_against":1.05,"barron_minutes":87,"rangers_possession":64},
      {"date":"2026-01-11","opposition":"aberdeen","home_away":"Away","goals_for":2,"goals_against":0,"npxg_for":1.16,"npxg_against":0.32,"barron_minutes":0,"rangers_possession":48},
      {"date":"2026-01-25","opposition":"dundee-fc","home_away":"Home","goals_for":3,"goals_against":0,"npxg_for":1.72,"npxg_against":0.24,"barron_minutes":0,"rangers_possession":54},
      {"date":"2026-02-01","opposition":"hibernian","home_away":"Away","goals_for":0,"goals_against":0,"npxg_for":0.58,"npxg_against":1.88,"barron_minutes":0,"rangers_possession":56},
      {"date":"2026-02-04","opposition":"kilmarnock","home_away":"Home","goals_for":5,"goals_against":1,"npxg_for":2.36,"npxg_against":1.29,"barron_minutes":0,"rangers_possession":69},
      {"date":"2026-02-11","opposition":"motherwell","home_away":"Away","goals_for":1,"goals_against":1,"npxg_for":1.64,"npxg_against":1.56,"barron_minutes":0,"rangers_possession":36},
      {"date":"2026-02-15","opposition":"hearts","home_away":"Home","goals_for":4,"goals_against":2,"npxg_for":2.41,"npxg_against":0.35,"barron_minutes":0,"rangers_possession":57},
      {"date":"2026-02-23","opposition":"livingston","home_away":"Away","goals_for":2,"goals_against":2,"npxg_for":3.59,"npxg_against":0.3,"barron_minutes":0,"rangers_possession":73},
      {"date":"2026-03-02","opposition":"celtic","home_away":"Home","goals_for":2,"goals_against":2,"npxg_for":1.44,"npxg_against":1.61,"barron_minutes":0,"rangers_possession":45},
      {"date":"2026-03-16","opposition":"st-mirren","home_away":"Away","goals_for":1,"goals_against":0,"npxg_for":2.08,"npxg_against":0.19,"barron_minutes":18,"rangers_possession":53},
      {"date":"2026-03-22","opposition":"aberdeen","home_away":"Home","goals_for":4,"goals_against":1,"npxg_for":1.61,"npxg_against":0.6,"barron_minutes":9,"rangers_possession":62},
      {"date":"2026-04-05","opposition":"dundee-united","home_away":"Home","goals_for":4,"goals_against":2,"npxg_for":3.89,"npxg_against":1.47,"barron_minutes":8,"rangers_possession":67},
      {"date":"2026-04-13","opposition":"falkirk","home_away":"Away","goals_for":6,"goals_against":3,"npxg_for":3.94,"npxg_against":0.91,"barron_minutes":13,"rangers_possession":48},
      {"date":"2026-04-27","opposition":"motherwell","home_away":"Home","goals_for":2,"goals_against":3,"npxg_for":2.21,"npxg_against":0.57,"barron_minutes":4,"rangers_possession":49}
    ];

    // Player season stats
    const playerStats = {
      goals:           0,
      assists:         2,
      xA:              1.62,
      chancesCreated:  21,
      passingPct:      88.4,
      tackles:         42,
      interceptions:   17,
      recoveries:      83,
    };

    const totalMins  = data.reduce((sum, m) => sum + m.barron_minutes, 0);
    const nineties   = totalMins / 90;
    const p90 = v => (v / nineties).toFixed(2);

    document.getElementById('stats-card').innerHTML = `
      <div class="stats-card">
        <div class="stats-card-header">
          <span class="stats-card-title">Season Statistics</span>
        </div>
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-value headline">${totalMins.toLocaleString()}</div>
            <div class="stat-label">Minutes</div>
          </div>
          <div class="stat-box">
            <div class="stat-value headline">${playerStats.goals}</div>
            <div class="stat-label">Goals</div>
          </div>
          <div class="stat-box">
            <div class="stat-value headline">${playerStats.assists}</div>
            <div class="stat-label">Assists</div>
          </div>
          <div class="stat-box">
            <div class="stat-value headline">${playerStats.xA.toFixed(2)}</div>
            <div class="stat-label">xA</div>
          </div>
        </div>
        <div class="stat-row-divider"></div>
        <div class="per90-label">Per 90 minutes</div>
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-value">${p90(playerStats.chancesCreated)}</div>
            <div class="stat-label">Chances Created</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${playerStats.passingPct.toFixed(1)}%</div>
            <div class="stat-label">Pass Accuracy</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${p90(playerStats.tackles)}</div>
            <div class="stat-label">Tackles</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${p90(playerStats.interceptions)}</div>
            <div class="stat-label">Interceptions</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${p90(playerStats.recoveries)}</div>
            <div class="stat-label">Recoveries</div>
          </div>
        </div>
      </div>`;

    function avg(arr) {
      const vals = arr.filter(v => v !== null && v !== undefined);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    }

    const over45  = data.filter(m => m.barron_minutes > 45);
    const under45 = data.filter(m => m.barron_minutes <= 45);

    const groups = [
      { label: 'Rangers average', count: data.length,    accent: '#f1c40f', goalsFor: avg(data.map(m => m.goals_for)),    goalsAgainst: avg(data.map(m => m.goals_against)),    possession: avg(data.map(m => m.rangers_possession)) },
      { label: 'Barron >45 mins', count: over45.length,  accent: '#1D4ED8', goalsFor: avg(over45.map(m => m.goals_for)),  goalsAgainst: avg(over45.map(m => m.goals_against)),  possession: avg(over45.map(m => m.rangers_possession)) },
      { label: 'Barron <45 mins', count: under45.length, accent: '#475569', goalsFor: avg(under45.map(m => m.goals_for)), goalsAgainst: avg(under45.map(m => m.goals_against)), possession: avg(under45.map(m => m.rangers_possession)) },
    ];

    const metrics = [
      { name: 'Goals Scored',   sub: 'avg per game', key: 'goalsFor',     lowerIsBetter: false, fmt: v => v.toFixed(2) },
      { name: 'Goals Conceded', sub: 'avg per game', key: 'goalsAgainst', lowerIsBetter: true,  fmt: v => v.toFixed(2) },
      { name: 'Possession',     sub: 'avg %',        key: 'possession',   lowerIsBetter: false, fmt: v => v.toFixed(1) + '%' },
    ];

    function deltaCell(val, baseline, lowerIsBetter, fmt) {
      const diff = val - baseline;
      if (Math.abs(diff) < 0.005) return '';
      const isGood = lowerIsBetter ? diff < 0 : diff > 0;
      const sign = diff > 0 ? '+' : '';
      return `<span class="comp-delta ${isGood ? 'good' : 'bad'}">${sign}${fmt(Math.abs(diff))}</span>`;
    }

    const colHeaders = groups.map(g => `
      <div class="comp-cell comp-col-head">
        <div class="col-accent" style="background:${g.accent}"></div>
        <div class="col-name">${g.label}</div>
        <div class="col-count">${g.count} games</div>
      </div>`).join('');

    const metricRows = metrics.map(m => {
      const cells = groups.map((g, i) => {
        const displayVal = m.key === 'possession' ? g[m.key].toFixed(1) + '%' : g[m.key].toFixed(2);
        const delta = i === 0 ? '' : deltaCell(g[m.key], groups[0][m.key], m.lowerIsBetter, m.fmt);
        return `<div class="comp-cell comp-value"><div class="comp-val">${displayVal}</div>${delta}</div>`;
      }).join('');
      return `
        <div class="comp-cell comp-metric-label">
          <div class="metric-name">${m.name}</div>
          <div class="metric-sub">${m.sub}</div>
        </div>
        ${cells}`;
    }).join('');

    document.getElementById('sections').innerHTML = `
      <div class="section">
        <div class="section-header">
          <span class="section-tag">2025/26</span>
          <span class="section-title">Connor Barron — Impact on Rangers</span>
        </div>
        <div class="comp-grid">
          <div class="comp-cell"></div>
          ${colHeaders}
          ${metricRows}
        </div>
      </div>`;
  </script>
</body>
</html>
