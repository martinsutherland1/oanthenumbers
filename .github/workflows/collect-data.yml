name: Collect match data

# Each league runs at its own UK time (SPFL 23:00, EPL 23:15, La Liga 23:30, Bundesliga 23:45,
# Serie A 01:00, Ligue 1 01:15). GitHub cron runs in UTC, so each time is scheduled for both BST and GMT and
# the "plan" job skips whichever doesn't match the current UK offset.
on:
  schedule:
    - cron: '0 22 * * *'   # SPFL, 23:00 BST
    - cron: '0 23 * * *'   # SPFL, 23:00 GMT
    - cron: '15 22 * * *'  # EPL, 23:15 BST
    - cron: '15 23 * * *'  # EPL, 23:15 GMT
    - cron: '30 22 * * *'  # La Liga, 23:30 BST
    - cron: '30 23 * * *'  # La Liga, 23:30 GMT
    - cron: '45 22 * * *'  # Bundesliga, 23:45 BST
    - cron: '45 23 * * *'  # Bundesliga, 23:45 GMT
    - cron: '0 0 * * *'    # Serie A, 01:00 BST
    - cron: '0 1 * * *'    # Serie A, 01:00 GMT
    - cron: '15 0 * * *'   # Ligue 1, 01:15 BST
    - cron: '15 1 * * *'   # Ligue 1, 01:15 GMT
  workflow_dispatch:
    inputs:
      league:
        description: League to collect
        type: choice
        options: [all, spfl, epl, laliga, bundesliga, seriea, ligue1]
        default: all

# Queue runs so the SPFL and EPL commits never race each other
concurrency:
  group: collect-data
  cancel-in-progress: false

env:
  # The collectors read fixture kick-off times as local time
  TZ: Europe/London

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      leagues: ${{ steps.plan.outputs.leagues }}
    steps:
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          LEAGUE_INPUT: ${{ inputs.league }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$LEAGUE_INPUT" in
              all) leagues="spfl epl laliga bundesliga seriea ligue1" ;;
              *) leagues="$LEAGUE_INPUT" ;;
            esac
          else
            offset=$(date +%z)   # +0100 in BST, +0000 in GMT
            case "$SCHEDULE" in
              '0 22 * * *')  [ "$offset" = "+0100" ] && leagues=spfl ;;
              '0 23 * * *')  [ "$offset" = "+0000" ] && leagues=spfl ;;
              '15 22 * * *') [ "$offset" = "+0100" ] && leagues=epl ;;
              '15 23 * * *') [ "$offset" = "+0000" ] && leagues=epl ;;
              '30 22 * * *') [ "$offset" = "+0100" ] && leagues=laliga ;;
              '30 23 * * *') [ "$offset" = "+0000" ] && leagues=laliga ;;
              '45 22 * * *') [ "$offset" = "+0100" ] && leagues=bundesliga ;;
              '45 23 * * *') [ "$offset" = "+0000" ] && leagues=bundesliga ;;
              '0 0 * * *')   [ "$offset" = "+0100" ] && leagues=seriea ;;
              '0 1 * * *')   [ "$offset" = "+0000" ] && leagues=seriea ;;
              '15 0 * * *')  [ "$offset" = "+0100" ] && leagues=ligue1 ;;
              '15 1 * * *')  [ "$offset" = "+0000" ] && leagues=ligue1 ;;
            esac
          fi
          echo "UK offset $(date +%z), schedule '$SCHEDULE' -> leagues: '${leagues:-none}'"
          echo "leagues=${leagues:-}" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    if: needs.plan.outputs.leagues != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        working-directory: playwright_js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright_js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Collect SPFL 2026/27
        if: contains(needs.plan.outputs.leagues, 'spfl')
        run: npm run collect_spfl_2026_27

      - name: Collect EPL 2026/27
        if: contains(needs.plan.outputs.leagues, 'epl')
        run: npm run collect_epl_2026_27

      - name: Collect La Liga 2026/27
        if: contains(needs.plan.outputs.leagues, 'laliga')
        run: npm run collect_laliga_2026_27

      - name: Collect Bundesliga 2026/27
        if: contains(needs.plan.outputs.leagues, 'bundesliga')
        run: npm run collect_bundesliga_2026_27

      - name: Collect Serie A 2026/27
        if: contains(needs.plan.outputs.leagues, 'seriea')
        run: npm run collect_seriea_2026_27

      - name: Collect Ligue 1 2026/27
        if: contains(needs.plan.outputs.leagues, 'ligue1')
        run: npm run collect_ligue1_2026_27

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright_js/playwright-report
          retention-days: 7

      - name: Commit updated data
        id: commit
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add playwright_js/collectedData playwright_js/transferredData oanthenumberapp/src/data
          if git diff --cached --quiet; then
            echo "No new data"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update ${{ needs.plan.outputs.leagues }} data ($(date +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so call the deploy directly
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.collect.outputs.sha }}
